# Debian 13 (trixie) arm64 appliance for Virtualization.framework.
# This image is os.img (guest /dev/nvme0n1). data.img is a separate host file.

[Distribution]
Distribution=debian
Release=trixie
Architecture=arm64

[Build]
# postinst fetches the pinned k3s-arm64 static binary.
WithNetwork=yes

[Output]
Format=disk
Output=os
OutputExtension=img
OutputSize=8G
OutputDirectory=mkosi.output

[Content]
Bootable=yes
Bootloader=systemd-boot
Hostname=gmak8
WithRecommends=no
# Regular arm64 kernel: CONFIG_KVM=y (built-in). Do not use linux-image-cloud-arm64.
Packages=
    linux-image-arm64
    systemd
    systemd-sysv
    systemd-boot
    systemd-boot-efi
    udev
    kmod
    dbus
    e2fsprogs
    util-linux
    openssh-server
    ca-certificates
    iproute2
    curl
    iptables
# sshd is in the image for PR 30 (Builderdash L1 jump) but must not start yet.
Ssh=never
KernelCommandLine=
    console=hvc0
    console=ttyAMA0
    systemd.ssh_auto=no
