apiVersion: v1
kind: Config
clusters:
- cluster:
    certificate-authority-data: A_CA
    server: https://a.example
  name: a
- cluster:
    certificate-authority-data: B_CA
    server: https://b.example
    custom-field: keep
  name: b
- cluster:
    certificate-authority-data: CA_DATA
    server: https://127.0.0.1:6443
  name: gmak8
users:
- name: a
  user:
    token: a-token
- name: b
  user:
    token: b-token
- name: gmak8
  user:
    client-certificate-data: CERT_DATA
    client-key-data: KEY_DATA
contexts:
- context:
    cluster: a
    user: a
    namespace: kube-system
  name: a
- context:
    cluster: b
    user: b
    namespace: default
  name: b
- context:
    cluster: gmak8
    user: gmak8
  name: gmak8
current-context: a
