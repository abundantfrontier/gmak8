name: airgap

# Metadata and Cosign fixture only. Does not download the real multi-hundred-MB
# k3s airgap tarball, run Virtualization.framework, or boot Linux.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  metadata:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Pin, Cosign pubkey, size budget
        run: bash guest/airgap/assert-metadata.sh
      - name: Keyful Cosign sign/verify tiny fixture
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/v2.4.3/cosign-linux-arm64"
          chmod +x /tmp/cosign
          /tmp/cosign version
          /tmp/cosign verify-blob --key guest/airgap/testdata/cosign.pub \
            --signature guest/airgap/testdata/tiny.tar.sig \
            --insecure-ignore-tlog --offline \
            guest/airgap/testdata/tiny.tar
          tmp=$(mktemp -d)
          COSIGN_PASSWORD= /tmp/cosign generate-key-pair --output-key-prefix "$tmp/ci"
          cp guest/airgap/testdata/tiny.tar "$tmp/tiny.tar"
          COSIGN_PASSWORD= COSIGN_KEY="$tmp/ci.key" COSIGN="$tmp/cosign" \
            bash guest/airgap/sign.sh "$tmp/tiny.tar"
          /tmp/cosign verify-blob --key "$tmp/ci.pub" \
            --signature "$tmp/tiny.tar.sig" \
            --insecure-ignore-tlog --offline \
            "$tmp/tiny.tar"
          rm -rf "$tmp"
